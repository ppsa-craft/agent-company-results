# Gitleaks config — fail on ANY secret-like finding (high severity gate).
# Wired into CI (orchestrator-owned workflow) via `gitleaks detect --config .gitleaks.toml`.
# No allowlist entries — this gate is intentionally strict.

[extend]
# use the default gitleaks rule set
useDefault = true

[allowlist]
# Nothing is allowlisted: a single finding fails the gate.
