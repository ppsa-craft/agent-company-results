# Semgrep SAST config — fail on high-severity findings (security gate).
# Wired into CI (orchestrator-owned workflow) via `semgrep scan --config .semgrep.yml`.
# High-severity findings fail the gate; medium/low are logged for backlog.

rules:
  - id: no-hardcoded-secrets
    patterns:
      - pattern-either:
          - pattern: password = "..."
          - pattern: secret = "..."
          - pattern: token = "..."
          - pattern: api_key = "..."
    message: Hardcoded credential detected — must come from environment/settings.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-798"]

  - id: no-eval
    pattern: eval(...)
    message: Avoid eval on untrusted input.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-95"]

  - id: no-raw-sql-f-string
    pattern-either:
      - pattern: text(f"...")
      - pattern: execute(f"...")
    message: f-string SQL is injection-prone — use parameterized queries.
    languages: [python]
    severity: ERROR
    metadata:
      cwe: ["CWE-89"]
