version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: vnstock-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vnstock}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vnstock}
      POSTGRES_DB: ${POSTGRES_DB:-vnstock_advisor}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vnstock} -d ${POSTGRES_DB:-vnstock_advisor}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - vnstock-network

  redis:
    image: redis:7-alpine
    container_name: vnstock-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-vnstock}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - vnstock-network

volumes:
  postgres_data:
  redis_data:

networks:
  vnstock-network:
    driver: bridge