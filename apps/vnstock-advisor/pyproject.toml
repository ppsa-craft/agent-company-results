[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vnstock-advisor"
version = "0.1.0"
description = "Vietnam Stock Advisor - Monorepo for stock analysis and suggestion platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "ppsacraft"}
]
keywords = ["vnstock", "stock", "analysis", "advisor", "vietnam"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.10.0",
    "pre-commit>=3.6.0",
]

[tool.setuptools.packages.find]
where = ["shared/python/src"]
include = ["vnstock_shared*"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]
[tool.ruff.lint]
per-file-ignores = { "__init__.py" = ["F401"] }

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
strict_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services", "shared/python/tests"]
pythonpath = ["services/analysis-engine/src", "services/data-ingest/src", "shared/python/src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
importmode = "importlib"
markers = [
    "owasp: OWASP API Top 10 security tests",
]

[tool.coverage.run]
source = ["shared/python/src"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]