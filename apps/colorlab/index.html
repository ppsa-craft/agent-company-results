<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ColorLab — Color Palette Generator</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎨</text></svg>" />
  <style>
    :root {
      --bg: #f5f5f5;
      --surface: #ffffff;
      --text: #1a1a1a;
      --text-secondary: #666;
      --border: #ddd;
      --radius: 8px;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      margin-bottom: 2rem;
    }
    header h1 { font-size: 2rem; font-weight: 700; }
    header p { color: var(--text-secondary); margin-top: 0.25rem; }
    .controls {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: end;
    }
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
    }
    .control-group label {
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .color-picker-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    input[type="color"] {
      width: 48px;
      height: 48px;
      border: 2px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      padding: 2px;
    }
    input[type="text"] {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.9rem;
      width: 100px;
    }
    select, button {
      padding: 0.5rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 0.9rem;
      cursor: pointer;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      font-weight: 600;
      padding: 0.5rem 1.25rem;
      transition: background 0.15s;
    }
    button:hover { background: #1d4ed8; }
    .color-info {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1rem 1.5rem;
      box-shadow: var(--shadow);
      margin-bottom: 1.5rem;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 0.5rem;
    }
    .color-info .info-item {
      text-align: center;
    }
    .color-info .info-label {
      font-size: 0.7rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .color-info .info-value {
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.95rem;
      font-weight: 600;
    }
    .palette {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 1rem;
    }
    .palette-card {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
      transition: transform 0.15s;
    }
    .palette-card:hover { transform: translateY(-2px); }
    .color-swatch {
      height: 100px;
      display: flex;
      align-items: end;
      justify-content: center;
      padding: 0.75rem;
    }
    .color-swatch .hex-label {
      background: rgba(255,255,255,0.85);
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .palette-card .card-body {
      padding: 0.75rem;
    }
    .contrast-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      padding: 0.2rem 0;
    }
    .contrast-row .badge {
      display: inline-block;
      padding: 0.1rem 0.35rem;
      border-radius: 3px;
      font-size: 0.7rem;
      font-weight: 600;
    }
    .badge.pass { background: #d1fae5; color: #065f46; }
    .badge.fail { background: #fee2e2; color: #991b1b; }
    .badge.aa { background: #fef3c7; color: #92400e; }
    .footer {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--text-secondary);
    }
    @media (max-width: 640px) {
      .controls { flex-direction: column; }
      .palette { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>ColorLab</h1>
      <p>Color palette generator with WCAG contrast checking</p>
    </header>

    <div class="controls">
      <div class="control-group">
        <label>Base Color</label>
        <div class="color-picker-wrapper">
          <input type="color" id="colorPicker" value="#2563eb" />
          <input type="text" id="hexInput" value="#2563eb" maxlength="7" />
        </div>
      </div>
      <div class="control-group">
        <label>Algorithm</label>
        <select id="algorithm">
          <option value="monochromatic">Monochromatic</option>
          <option value="analogous" selected>Analogous</option>
          <option value="complementary">Complementary</option>
          <option value="triadic">Triadic</option>
          <option value="tetradic">Tetradic</option>
          <option value="split-complementary">Split Complementary</option>
        </select>
      </div>
      <div class="control-group">
        <label>Count</label>
        <select id="count">
          <option value="3">3</option>
          <option value="5" selected>5</option>
          <option value="7">7</option>
          <option value="10">10</option>
        </select>
      </div>
      <button id="generateBtn">Generate Palette</button>
    </div>

    <div class="color-info" id="colorInfo">
      <div class="info-item"><div class="info-label">HEX</div><div class="info-value" id="infoHex">#2563eb</div></div>
      <div class="info-item"><div class="info-label">HSL</div><div class="info-value" id="infoHsl">—</div></div>
      <div class="info-item"><div class="info-label">RGB</div><div class="info-value" id="infoRgb">—</div></div>
    </div>

    <div class="palette" id="palette"></div>

    <div class="footer">
      ColorLab — Zero-dependency, client-side color palette generator
    </div>
  </div>

  <script type="module">
    import { hexToHsl, hslToHex, rgbToHex, hexToRgb } from './src/core/conversions.ts';
    import { generatePalette } from './src/core/palette.ts';
    import { getContrastRating } from './src/core/contrast.ts';

    const colorPicker = document.getElementById('colorPicker');
    const hexInput = document.getElementById('hexInput');
    const algorithm = document.getElementById('algorithm');
    const countSelect = document.getElementById('count');
    const generateBtn = document.getElementById('generateBtn');
    const paletteEl = document.getElementById('palette');
    const infoHex = document.getElementById('infoHex');
    const infoHsl = document.getElementById('infoHsl');
    const infoRgb = document.getElementById('infoRgb');

    function formatHsl(hsl) {
      return `${hsl.h}° ${hsl.s}% ${hsl.l}%`;
    }

    function formatRgb(rgb) {
      return `rgb(${rgb.r}, ${rgb.g}, ${rgb.b})`;
    }

    function updateColorInfo(hex) {
      const hsl = hexToHsl(hex);
      const rgb = hexToRgb(hex);
      infoHex.textContent = hex;
      infoHsl.textContent = formatHsl(hsl);
      infoRgb.textContent = formatRgb(rgb);
    }

    function renderPalette(hex, algo, count) {
      const hsl = hexToHsl(hex);
      const colors = generatePalette(hsl, algo, { count });
      const white = { r: 255, g: 255, b: 255 };
      const black = { r: 0, g: 0, b: 0 };
      const hexes = colors.map(c => hslToHex(c));

      paletteEl.innerHTML = hexes.map((h, i) => {
        const rgb = hexToRgb(h);
        const wc = getContrastRating(rgb, white);
        const bc = getContrastRating(rgb, black);
        return `
          <div class="palette-card">
            <div class="color-swatch" style="background: ${h}">
              <span class="hex-label">${h}</span>
            </div>
            <div class="card-body">
              <div class="contrast-row">
                <span>vs White</span>
                <span>
                  <span class="badge ${wc.aa.normal ? 'pass' : 'fail'}">AA${wc.aa.normal ? '✓' : '✗'}</span>
                  <span class="badge ${wc.aaa.normal ? 'pass' : 'fail'}">AAA${wc.aaa.normal ? '✓' : '✗'}</span>
                </span>
              </div>
              <div class="contrast-row">
                <span>vs Black</span>
                <span>
                  <span class="badge ${bc.aa.normal ? 'pass' : 'fail'}">AA${bc.aa.normal ? '✓' : '✗'}</span>
                  <span class="badge ${bc.aaa.normal ? 'pass' : 'fail'}">AAA${bc.aaa.normal ? '✓' : '✗'}</span>
                </span>
              </div>
              <div class="contrast-row" style="font-size:0.7rem;color:var(--text-secondary);padding-top:0.3rem">
                Ratio: ${wc.ratio.toFixed(2)} / ${bc.ratio.toFixed(2)}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function generate() {
      const hex = hexInput.value.startsWith('#') ? hexInput.value : '#' + hexInput.value;
      const algo = algorithm.value;
      const count = parseInt(countSelect.value);
      if (!/^#[0-9a-f]{6}$/i.test(hex)) return;
      colorPicker.value = hex;
      updateColorInfo(hex);
      renderPalette(hex, algo, count);
    }

    colorPicker.addEventListener('input', () => {
      hexInput.value = colorPicker.value;
      generate();
    });

    hexInput.addEventListener('change', () => {
      let val = hexInput.value;
      if (!val.startsWith('#')) val = '#' + val;
      if (/^#[0-9a-f]{6}$/i.test(val)) {
        colorPicker.value = val;
        generate();
      }
    });

    generateBtn.addEventListener('click', generate);
    algorithm.addEventListener('change', generate);
    countSelect.addEventListener('change', generate);

    // Initial render
    generate();
  </script>
</body>
</html>
