<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Counter — Word, Character, Sentence, Paragraph Count</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <h1>Text Counter</h1>
        <p class="subtitle">Count words, characters, sentences, paragraphs, and estimate reading time.</p>
        
        <div class="input-section">
            <label for="text-input">Enter your text:</label>
            <textarea id="text-input" rows="10" placeholder="Paste or type your text here..."></textarea>
            <div class="actions">
                <button id="clear-btn" type="button">Clear</button>
                <button id="copy-btn" type="button">Copy Stats</button>
            </div>
        </div>
        
        <div class="stats-section">
            <h2>Statistics</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <span class="stat-label">Words</span>
                    <span class="stat-value" id="word-count">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Characters (with spaces)</span>
                    <span class="stat-value" id="char-count-spaces">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Characters (without spaces)</span>
                    <span class="stat-value" id="char-count-no-spaces">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Sentences</span>
                    <span class="stat-value" id="sentence-count">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Paragraphs</span>
                    <span class="stat-value" id="paragraph-count">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Reading Time</span>
                    <span class="stat-value" id="reading-time">0 min</span>
                </div>
            </div>
        </div>
        
        <footer class="footer">
            <p>Text Counter — Built with vanilla JS, no external dependencies.</p>
        </footer>
    </main>
    
    <script src="js/bundle.js"></script>
</body>
</html>
